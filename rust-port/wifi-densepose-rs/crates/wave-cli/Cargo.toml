[package]
name = "wave-cli"
version.workspace = true
edition.workspace = true
description = "Wave management CLI — manage the sensing system, nodes, and hardware from the command line"
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "wave-cli"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4.4", features = ["derive", "env", "wrap_help"] }

# HTTP client for the sensing-server REST API (localhost by default; rustls so no
# system OpenSSL is required for any future https targets).
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }

# Node-direct OTA/WASM (multipart + HMAC-SHA256 PSK signing, matching the desktop).
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

# Async runtime
tokio = { version = "1.35", features = ["macros", "rt-multi-thread", "process", "signal", "time"] }

# Serialization / output
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Output formatting (TTY-aware tables)
comfy-table = "7.1"
owo-colors = "4.0"

# Error handling
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Admin (backend "D"): read/write the desktop's wave.db directly. Use sqlx (the
# same version the workspace already links) to avoid a libsqlite3-sys conflict.
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "sqlite"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
uuid = { version = "1", features = ["v4"] }

# Frappe/enterprise config: the OS keychain, same service the desktop uses
# (`wave-frappe`), so credentials set here are picked up by the app and vice-versa.
keyring = "2"

# License activation: same hardware fingerprint the desktop binds (SHA-256 of the
# machine UID) so a key activated here validates identically in the app.
machine-uid = "0.5"

# Windows-only: edit the user PATH registry for `wave-cli path install`.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
