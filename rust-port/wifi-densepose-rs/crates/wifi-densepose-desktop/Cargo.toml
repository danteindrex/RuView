[package]
name = "wifi-densepose-desktop"
version.workspace = true
edition.workspace = true
description = "Tauri v2 desktop frontend for Wave WiFi DensePose"
license.workspace = true
authors.workspace = true

[lib]
name = "wifi_densepose_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Required by tauri v2 for production (release) builds: serves the bundled
# frontend over the tauri:// custom protocol instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-stronghold = "2"

# Encryption-at-rest (AES-256-GCM, FIPS 140-3)
aws-lc-rs = { version = "1", features = ["fips"] }
# BUILD NOTE: aws-lc-rs fips (and non-fips on windows-msvc) requires NASM + Go + CMake.
# On Windows: install NASM (https://www.nasm.us/), Go (https://go.dev/), CMake, then retry.
# The aws-lc-sys build script will panic with "NASM command not found" until these are present.
zeroize = { version = "1.7", features = ["derive"] }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

# Discovery (mDNS + UDP)
mdns-sd = "0.11"
flume = "0.11"

# Serial port (cross-platform)
tokio-serial = "5.4"

# HTTP client for OTA/WASM (native-tls for Windows compatibility)
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "native-tls"] }

# Crypto for OTA PSK
sha2 = "0.10"
hmac = "0.12"

# System info for server management
sysinfo = "0.32"

# Async utilities
futures = "0.3"

# Logging
tracing = "0.1"

# UUID for session IDs
uuid = { version = "1.0", features = ["v4", "serde"] }

# Hex encoding for hashes
hex = "0.4"

# Regex for parsing espflash output
regex = "1.10"

# Serial port for WiFi configuration
serialport.workspace = true

# Auth system — user management, tenancy, RBAC
sqlx = { workspace = true }
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"
machine-uid = "0.5"

# Unix signals for graceful process termination
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
