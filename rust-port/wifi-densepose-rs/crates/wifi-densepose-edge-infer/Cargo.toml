[package]
name = "wifi-densepose-edge-infer"
version = "0.1.0"
edition = "2021"
description = "Tiny CSI-embedding model inference (8->64->128 MLP + BN + per-room LoRA + presence head). Shared by the sensing-server (hub) and the Pi node agent; the ESP32 C port is parity-tested against it."
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
