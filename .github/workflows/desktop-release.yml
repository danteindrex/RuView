name: Desktop Release

# Builds Wave Desktop installers for Windows, macOS (Intel + Apple Silicon), and
# Linux, and publishes them to a GitHub Release. macOS/Linux cannot be built on
# Windows, so this CI (free & unlimited for public repos) is the path to them.
#
# Trigger: push a tag like `desktop-v0.4.4`, or run manually (workflow_dispatch).

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag suffix (e.g. 0.4.4 -> tag desktop-v0.4.4)'
        required: true
        default: '0.4.4'

env:
  CARGO_TERM_COLOR: always
  # Path to the Tauri project (the desktop crate) and the workspace root.
  TAURI_CRATE: rust-port/wifi-densepose-rs/crates/wifi-densepose-desktop
  WORKSPACE: rust-port/wifi-densepose-rs

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS (Apple Silicon)
            triple: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            label: macOS (Intel)
            triple: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            label: Linux (x64)
            triple: x86_64-unknown-linux-gnu
            args: ''
          - platform: windows-latest
            label: Windows (x64)
            triple: x86_64-pc-windows-msvc
            args: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.WORKSPACE }}

      # Linux needs the GTK/WebKit toolchain Tauri links against.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install frontend dependencies (ui-v2)
        working-directory: ui-v2
        run: npm ci

      # Build the sensing-server for this target and stage it as the Tauri
      # sidecar (externalBin) so the installer bundles it — without this the
      # installed app can't start its server (0 nodes, blank UI).
      - name: Build & stage sensing-server sidecar
        shell: bash
        working-directory: ${{ env.WORKSPACE }}
        run: |
          set -euo pipefail
          TRIPLE="${{ matrix.triple }}"
          EXT=""
          [ "${{ runner.os }}" = "Windows" ] && EXT=".exe"
          if [ -n "${{ matrix.args }}" ]; then
            cargo build --release -p wifi-densepose-sensing-server --target "$TRIPLE"
            SRC="target/${TRIPLE}/release/sensing-server${EXT}"
          else
            cargo build --release -p wifi-densepose-sensing-server
            SRC="target/release/sensing-server${EXT}"
          fi
          mkdir -p crates/wifi-densepose-desktop/binaries
          cp "$SRC" "crates/wifi-densepose-desktop/binaries/sensing-server-${TRIPLE}${EXT}"
          echo "Staged sidecar: sensing-server-${TRIPLE}${EXT}"

      # Build the management CLI and stage it as a second sidecar. On Windows the
      # installer's NSIS hook adds it to PATH so `wave-cli` is globally callable.
      - name: Build & stage wave-cli sidecar
        shell: bash
        working-directory: ${{ env.WORKSPACE }}
        run: |
          set -euo pipefail
          TRIPLE="${{ matrix.triple }}"
          EXT=""
          [ "${{ runner.os }}" = "Windows" ] && EXT=".exe"
          if [ -n "${{ matrix.args }}" ]; then
            cargo build --release -p wave-cli --target "$TRIPLE"
            SRC="target/${TRIPLE}/release/wave-cli${EXT}"
          else
            cargo build --release -p wave-cli
            SRC="target/release/wave-cli${EXT}"
          fi
          cp "$SRC" "crates/wifi-densepose-desktop/binaries/wave-cli-${TRIPLE}${EXT}"
          echo "Staged sidecar: wave-cli-${TRIPLE}${EXT}"

      - name: Build & release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ${{ env.TAURI_CRATE }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', github.event.inputs.version) }}
          releaseName: 'Wave Desktop __VERSION__'
          releaseBody: |
            Wave Desktop — WiFi-CSI human sensing.

            | Platform | File |
            |----------|------|
            | Windows | `.msi` (installer) or `.exe` (NSIS setup) |
            | macOS (Apple Silicon / Intel) | `.dmg` |
            | Linux | `.AppImage`, `.deb` |

            The sensing server is bundled inside the app — no separate download.

            Note: hardware provisioning (ESP32 flashing, WiFi scan, serial
            discovery) is currently Windows-only; macOS/Linux builds work as
            monitoring/viewer apps.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
