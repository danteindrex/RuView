version: "3.9"

services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ruview_root}
      MYSQL_DATABASE: ${DB_NAME:-ruview_frappe}
      MYSQL_USER: ${DB_USER:-ruview}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ruview_pass}
    volumes:
      - db_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped

  redis-socketio:
    image: redis:7-alpine
    restart: unless-stopped

  frappe:
    image: frappe/bench:latest
    restart: unless-stopped
    depends_on: [db, redis-cache, redis-queue, redis-socketio]
    ports:
      - "8080:8080"
    environment:
      FRAPPE_SITE_NAME: ${FRAPPE_SITE:-ruview.localhost}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-ruview_frappe}
      DB_USER: ${DB_USER:-ruview}
      DB_PASSWORD: ${DB_PASSWORD:-ruview_pass}
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      REDIS_SOCKETIO: redis-socketio:6379
    volumes:
      - frappe_sites:/home/frappe/frappe-bench/sites
      - ./apps/ruview_care:/home/frappe/frappe-bench/apps/ruview_care

volumes:
  db_data:
  frappe_sites:
